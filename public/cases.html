<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختبار تَبَيَّن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>اختبار تَبَيَّن</h1>
    <p class="tagline">تُشغَّل الحالات على الأداة نفسها، وتُقارن النتيجة بالحالة المتوقعة. لا تُحفظ النتائج على أي خادم.</p>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <button id="run" class="primary">تشغيل الاختبار</button>
        <button id="base" class="ghost">مقارنة بنموذج لغوي عام</button>
        <button id="md" class="ghost" disabled>نسخ النتائج</button>
        <a href="/">العودة إلى الأداة</a>
      </div>
      <p class="note">«مقارنة بنموذج عام» تعرض جواب نموذج لغوي بلا مصادر على الحالات نفسها، لتُراجَع يدوياً: هل اختلق حكماً أو مصدراً؟</p>
    </section>
    <p id="status" class="status"></p>
    <div id="metrics" class="summary"></div>
    <table>
      <thead><tr><th>#</th><th>النوع</th><th>المدخل</th><th>المتوقع</th><th>النتيجة</th><th>تطابق</th><th>الزمن</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="baseRows" class="results"></div>
  </main>
  <script type="module" src="/cases.js"></script>
</body>
</html>
